version: "3.8"

services:
  app:
    build: .
    image: domain-ops-radar:latest
    container_name: domain-ops-radar
    restart: unless-stopped
    ports:
      - "8080:3000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/domains.db
      - BASE_URL=http://localhost:8080
      # Optional: Set ADMIN_PASSWORD for authentication
      # - ADMIN_PASSWORD=your-secure-password
    # Optional: Healthcheck
